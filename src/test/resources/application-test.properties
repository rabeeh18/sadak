# Integration tests run against the fleet_test database on the local PostgreSQL (no Docker needed).
spring.datasource.url=jdbc:postgresql://${FLEET_DB_HOST:localhost}:${FLEET_DB_PORT:5433}/fleet_test
spring.flyway.clean-disabled=false

# Never call the public routing server from tests: an unreachable address forces the straight-line fallback.
fleet.routing.osrm-base-url=http://127.0.0.1:9
fleet.routing.timeout=PT0.3S

logging.level.com.fleetops=WARN

# No simulator, monitoring loop or demo dispatching while tests drive the services directly.
fleet.live-loops=false
