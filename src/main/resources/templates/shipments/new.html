<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <th:block th:replace="~{layout :: head('Book a shipment')}"></th:block>
  <th:block th:replace="~{layout :: leafletCss}"></th:block>
</head>
<body>
<header th:replace="~{layout :: header('shipments')}"></header>
<main class="page">
  <a class="back" href="/shipments"><svg class="icon"><use href="/img/icons.svg#i-arrow-left"></use></svg>Shipments</a>
  <div class="page-head"><div><h1>Book a shipment</h1><p class="sub">Click the map to set the drop point. The tracking number is issued when you save.</p></div></div>
  <th:block th:replace="~{layout :: flash}"></th:block>
  <form method="post" action="/shipments" class="grid-2">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <section class="panel">
      <div class="panel-head"><h2>Details</h2></div>
      <div class="panel-body">
        <div class="field"><label for="wh">Ships from</label>
          <select id="wh" name="warehouseId" required><option th:each="w : ${warehouses}" th:value="${w.id}" th:text="${w.name}">WH</option></select></div>
        <div class="form-grid">
          <div class="field"><label for="rn">Recipient</label><input id="rn" name="recipientName" required autocomplete="off"></div>
          <div class="field"><label for="rp">Recipient phone</label><input id="rp" name="recipientPhone" type="tel" placeholder="+91 98…"></div>
        </div>
        <div class="field"><label for="dn">Drop point name</label><input id="dn" name="destName" required placeholder="Moga — Sandhu Agro Traders"></div>
        <div class="field"><label for="da">Address</label><input id="da" name="destAddress" required placeholder="Main Bazaar, Moga, Punjab"></div>
        <div class="form-grid">
          <div class="field"><label for="pin">PIN code</label><input id="pin" name="destPin" required pattern="\d{6}" inputmode="numeric" maxlength="6" placeholder="142001"></div>
          <div class="field"><label for="wt">Weight (kg)</label><input id="wt" name="weightKg" type="number" min="1" max="3500" required value="120"></div>
          <div class="field"><label for="dl">Deliver by</label><input id="dl" name="deadline" type="datetime-local" required th:value="${defaultDeadline}"></div>
        </div>
        <div class="form-grid">
          <div class="field"><label for="lat">Latitude</label><input id="lat" name="destLat" type="number" step="0.00001" required data-lat></div>
          <div class="field"><label for="lng">Longitude</label><input id="lng" name="destLng" type="number" step="0.00001" required data-lng></div>
        </div>
        <button class="btn btn-primary" type="submit">Book shipment</button>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Drop point</h2><span class="small muted" data-pick-grid>Click the map</span></div>
      <div style="height:480px" data-pick-map></div>
    </section>
  </form>
</main>
<th:block th:replace="~{layout :: scripts}"></th:block>
<th:block th:replace="~{layout :: leafletJs}"></th:block>
<script src="/js/pick-point.js"></script>
</body>
</html>
