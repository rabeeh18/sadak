<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Shipments')}"></head>
<body>
<header th:replace="~{layout :: header('shipments')}"></header>
<main class="page">
  <div class="page-head">
    <div>
      <h1>Shipments</h1>
      <p class="sub"><th:block th:text="${waiting}">0</th:block> waiting for planning.</p>
    </div>
    <div class="page-actions">
      <a class="btn" href="/planning">Plan waiting shipments</a>
      <a class="btn btn-primary" href="/shipments/new"><svg class="icon"><use href="/img/icons.svg#i-plus"></use></svg>Book a shipment</a>
    </div>
  </div>
  <th:block th:replace="~{layout :: flash}"></th:block>
  <section class="panel">
    <form class="filters" method="get" action="/shipments">
      <div class="field" style="min-width:240px"><label for="q">Search</label><input id="q" type="search" name="q" th:value="${q}" placeholder="Tracking number, recipient or place"></div>
      <div class="field"><label for="s-status">Status</label><select id="s-status" name="status"><option value="">Any</option>
        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label()}" th:selected="${s == status}"></option></select></div>
      <div class="field"><label for="s-wh">From</label><select id="s-wh" name="warehouse"><option value="">All warehouses</option>
        <option th:each="w : ${warehouses}" th:value="${w.id}" th:text="${w.name}" th:selected="${w.id == warehouse}"></option></select></div>
      <button class="btn" type="submit"><svg class="icon"><use href="/img/icons.svg#i-search"></use></svg>Search</button>
    </form>
    <div class="table-wrap">
      <table class="data">
        <thead><tr><th>Tracking</th><th>Status</th><th>Recipient</th><th>Destination</th><th>From</th><th class="r">Weight</th><th>Due</th><th>Delivered</th><th>Trip</th></tr></thead>
        <tbody>
          <tr th:each="s : ${page.content}" th:attr="data-href=@{/shipments/{id}(id=${s.id})}">
            <td><a th:href="@{/shipments/{id}(id=${s.id})}" th:text="${s.trackingNo}" style="font-weight:700">FL</a></td>
            <td><span th:replace="~{parts :: shipmentStatus(${s.status})}"></span><span class="tag tag-orange" th:if="${s.wasDelayed and s.status.name() != 'FAILED'}" style="margin-left:4px">late</span></td>
            <td th:text="${s.recipientName}">r</td>
            <td th:text="${s.destName}">d</td>
            <td th:text="${s.originWarehouse.code}">LDH</td>
            <td class="r num" th:text="${s.weightKg} + ' kg'">kg</td>
            <td class="num" th:text="${@fmt.when(s.deadline)}">due</td>
            <td class="num" th:text="${@fmt.when(s.deliveredAt)}">—</td>
            <td><a th:if="${s.trip != null}" th:href="@{/trips/{id}(id=${s.trip.id})}" th:text="${s.trip.code}">TR</a></td>
          </tr>
          <tr th:if="${page.content.isEmpty()}"><td colspan="9"><div class="empty"><strong>No shipments found</strong>Try a different search.</div></td></tr>
        </tbody>
      </table>
    </div>
    <nav th:replace="~{parts :: pager(${page}, '/shipments?' + (${q} != null ? 'q=' + ${q} + '&' : '') + (${status} != null ? 'status=' + ${status} + '&' : '') + (${warehouse} != null ? 'warehouse=' + ${warehouse} + '&' : ''))}"></nav>
  </section>
</main>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
