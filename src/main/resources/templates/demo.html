<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Demo')}"></head>
<body class="login-body">
<main class="login">
  <section class="login-sheet demo-sheet">
    <div class="login-collar">
      <span class="mark-p4" style="--s:52px" lang="pa" aria-hidden="true">ਸ<span>ੜ</span>ਕ</span>
      <div>
        <h1 class="sheet-title">Sadak demo</h1>
        <p class="muted">Pick who you want to be. Everything here is synthetic data, and trips keep dispatching by themselves.</p>
      </div>
    </div>

    <form method="post" action="/demo-login" class="demo-roles">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="demo-role" name="as" value="dispatcher" type="submit">
        <svg class="icon"><use href="/img/icons.svg#i-map"></use></svg>
        <strong>Dispatcher</strong>
        <span class="small muted">Watch trucks live on the map, see risk scores and handle incidents.</span>
      </button>
      <button class="demo-role" name="as" value="driver" type="submit">
        <svg class="icon"><use href="/img/icons.svg#i-truck"></use></svg>
        <strong>Driver</strong>
        <span class="small muted">The phone screen: start a trip, confirm arrivals and record deliveries.</span>
      </button>
      <button class="demo-role" name="as" value="warehouse" type="submit">
        <svg class="icon"><use href="/img/icons.svg#i-warehouse"></use></svg>
        <strong>Warehouse</strong>
        <span class="small muted">The Patiala desk: departures, parcels coming back, customer complaints and notes.</span>
      </button>
      <button class="demo-role" name="as" value="admin" type="submit">
        <svg class="icon"><use href="/img/icons.svg#i-shield"></use></svg>
        <strong>Admin</strong>
        <span class="small muted">Everything a dispatcher sees, plus users, risk rules and the audit log.</span>
      </button>
    </form>

    <p class="small demo-back"><a href="/login"><svg class="icon"><use href="/img/icons.svg#i-arrow-left"></use></svg>Back to sign in</a></p>
  </section>
</main>
</body>
</html>
