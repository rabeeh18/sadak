<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Choose a password')}"></head>
<body class="login-body">
<main class="login">
  <section class="login-sheet">
    <div class="login-collar">
      <span class="mark-p4" style="--s:40px" lang="pa" aria-hidden="true">ਸ<span>ੜ</span>ਕ</span>
      <div>
        <h1 class="sheet-title" th:text="${invite} ? 'Welcome to Sadak' : 'Choose a new password'">Choose a password</h1>
        <p class="muted" th:if="${person != null}" th:text="${person} + ' · ' + ${email}">name</p>
      </div>
    </div>

    <th:block th:if="${expired}">
      <div class="flash flash-error" role="alert">This link has expired or was already used.</div>
      <p class="small">Ask your admin to send you a new link.</p>
    </th:block>

    <form method="post" action="/account/set-password" th:unless="${expired}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" name="token" th:value="${token}">
      <div class="flash flash-error" role="alert" th:if="${problem}" th:text="${problem}">problem</div>
      <p class="small muted" th:if="${invite}">Choose the password you'll use to sign in with this email.</p>
      <input type="email" name="username" th:value="${email}" autocomplete="username" hidden>
      <div class="field">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" th:attr="minlength=${minLength}" maxlength="72" required autocomplete="new-password" autofocus>
        <div class="hint" th:text="'At least ' + ${minLength} + ' characters.'">At least 10 characters.</div>
      </div>
      <div class="field">
        <label for="confirm">Type it again</label>
        <input id="confirm" name="confirm" type="password" th:attr="minlength=${minLength}" maxlength="72" required autocomplete="new-password">
      </div>
      <button class="btn btn-primary btn-block" type="submit">Save password</button>
    </form>
  </section>
</main>
</body>
</html>
