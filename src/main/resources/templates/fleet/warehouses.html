<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Warehouses')}"></head>
<body>
<header th:replace="~{layout :: header('fleet')}"></header>
<main class="page">
  <div class="page-head"><div><h1>Fleet</h1><p class="sub" th:text="${warehouses.size()} + ' warehouses'">x</p></div></div>
  <nav th:replace="~{parts :: fleetTabs(${tab})}"></nav>
  <th:block th:replace="~{layout :: flash}"></th:block>
  <div class="grid-main-side">
    <section class="panel">
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th>Code</th><th>Warehouse</th><th>Address</th><th>Sq.</th><th class="r">Vehicles</th><th>Status</th><th></th></tr></thead>
          <tbody>
            <tr th:each="w : ${warehouses}">
              <td><strong th:text="${w.code}" style="color:var(--contour)">LDH</strong></td>
              <td th:text="${w.name}">name</td>
              <td class="small" th:text="${w.address}">addr</td>
              <td><span class="grid-ref" th:text="${@fmt.grid(w.lat, w.lng)}">A1</span></td>
              <td class="r num" th:text="${vehicleCounts[w.id] ?: 0}">0</td>
              <td><span class="tag" th:classappend="${w.active} ? 'tag-green' : 'tag-ink'" th:text="${w.active} ? 'Active' : 'Inactive'">a</span></td>
              <td>
                <details class="row-actions"><summary class="btn btn-sm btn-quiet">Edit</summary>
                  <div class="row-actions-pop" style="width:300px">
                    <form method="post" th:action="@{/fleet/warehouses/{id}(id=${w.id})}">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                      <div class="field"><label>Name</label><input name="name" th:value="${w.name}" required></div>
                      <div class="field"><label>City</label><input name="city" th:value="${w.city}" required></div>
                      <div class="field"><label>Address</label><input name="address" th:value="${w.address}" required></div>
                      <div class="form-grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Lat</label><input name="lat" type="number" step="0.00001" th:value="${w.lat}"></div>
                        <div class="field"><label>Lng</label><input name="lng" type="number" step="0.00001" th:value="${w.lng}"></div></div>
                      <label class="check field"><input type="checkbox" name="active" value="true" th:checked="${w.active}"> Active</label>
                      <button class="btn btn-sm btn-primary" type="submit">Save</button>
                    </form>
                  </div>
                </details>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
    <aside>
      <section class="panel">
        <div class="panel-head"><h2>Add a warehouse</h2></div>
        <form class="panel-body" method="post" action="/fleet/warehouses">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <div class="form-grid" style="grid-template-columns:90px 1fr"><div class="field"><label for="code">Code</label><input id="code" name="code" maxlength="6" required></div>
            <div class="field"><label for="name">Name</label><input id="name" name="name" required></div></div>
          <div class="field"><label for="city">City</label><input id="city" name="city" required></div>
          <div class="field"><label for="addr">Address</label><input id="addr" name="address" required></div>
          <div class="form-grid" style="grid-template-columns:1fr 1fr"><div class="field"><label for="lat">Latitude</label><input id="lat" name="lat" type="number" step="0.00001" required></div>
            <div class="field"><label for="lng">Longitude</label><input id="lng" name="lng" type="number" step="0.00001" required></div></div>
          <button class="btn btn-primary" type="submit">Add warehouse</button>
        </form>
      </section>
    </aside>
  </div>
</main>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
