spring.application.name=fleet-ops

# Local credentials live in .env.local (gitignored), imported as a properties file.
spring.config.import=optional:file:.env.local[.properties]

spring.datasource.url=jdbc:postgresql://${FLEET_DB_HOST:localhost}:${FLEET_DB_PORT:5433}/${FLEET_DB_NAME:fleet}
spring.datasource.username=${FLEET_DB_USER:fleet}
spring.datasource.password=${FLEET_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso
server.error.whitelabel.enabled=false
server.servlet.session.timeout=8h

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Demo profile seeds Punjab reference data, demo users and history on first start.
spring.profiles.default=demo

fleet.display-zone=Asia/Kolkata
fleet.demo.password=${FLEET_DEMO_PASSWORD:}

# Routing: public OSRM, called once per route plan and cached.
fleet.routing.osrm-base-url=https://router.project-osrm.org
fleet.routing.timeout=PT6S
fleet.routing.fallback-speed-kph=42
fleet.routing.fallback-road-factor=1.3

logging.level.com.fleetops=INFO
