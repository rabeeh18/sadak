<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;background:#f1f5f9;color:#0f172a;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.nav{position:absolute;left:0;top:0;bottom:0;width:64px;background:#0f172a;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:18px}
.nav i{width:28px;height:28px;border-radius:8px;background:#334155}.nav i.on{background:#2563eb}
.wrap{margin-left:64px;padding:20px;display:grid;grid-template-rows:auto 1fr;gap:16px;height:900px}
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.kp div{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px}
.kp b{display:block;font-size:26px}.kp span{color:#64748b;font-size:12px}
.body{display:grid;grid-template-columns:1fr 400px;gap:16px}
.map{background:#e2e8f0;border-radius:12px;position:relative;overflow:hidden}.map svg{position:absolute;inset:0}
.list{display:flex;flex-direction:column;gap:10px}
.c{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;display:flex;justify-content:space-between}
.c small{color:#64748b;display:block}.badge{border-radius:999px;padding:2px 10px;font-size:12px;height:22px}
</style></head><body>
